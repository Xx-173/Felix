# Add to compose.yml to run a private PostgreSQL service on the same host.
services:
  felix:
    environment:
      FELIX_DATABASE_TYPE: postgresql
      FELIX_DATABASE_URL: postgresql://felix:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in deploy/web.env}@postgres:5432/felix
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: felix
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/web.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U felix -d felix']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
